name: AI NEWSROOM Live Source Smoke

on:
  push:
    branches: [codex/newsroom-development]
    paths:
      - AI_NEWSROOM_GITHUB_RC/app/korean_news_sources.py
      - AI_NEWSROOM_GITHUB_RC/scripts/live_source_smoke.py
      - .github/workflows/development-live-source-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsroom-live-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI_NEWSROOM_GITHUB_RC
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_NEWSROOM_GITHUB_RC/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe curated publisher RSS endpoints
        run: python scripts/live_source_smoke.py --min-success-ratio 0.75 --output reports/live-source-smoke.json
      - name: Save live source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: AI_NEWSROOM_GITHUB_RC/reports/live-source-smoke.json
          retention-days: 7
          if-no-files-found: warn
