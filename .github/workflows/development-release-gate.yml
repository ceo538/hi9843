name: AI NEWSROOM DEV Release Gate

on:
  workflow_dispatch:
  push:
    branches: [codex/newsroom-development]
    paths:
      - AI_NEWSROOM_GITHUB_RC/app/runtime.py
      - AI_NEWSROOM_GITHUB_RC/app/maintenance.py
      - AI_NEWSROOM_GITHUB_RC/app/scheduler.py
      - AI_NEWSROOM_GITHUB_RC/scripts/runtime_preflight.py
      - AI_NEWSROOM_GITHUB_RC/scripts/backup_database.py
      - .github/workflows/development-release-gate.yml

permissions:
  contents: read

concurrency:
  group: newsroom-dev-release-gate
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AI_NEWSROOM_GITHUB_RC
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
      AI_NEWSROOM_DB_PATH: reports/release-gate.db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_NEWSROOM_GITHUB_RC/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app scripts
      - name: Full deterministic test suite
        run: python -m pytest -q
      - name: Runtime preflight
        run: python scripts/runtime_preflight.py
      - name: Backup smoke
        run: python scripts/backup_database.py --destination reports/backups --retain 2
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Windows browser E2E
        run: python scripts/windows_e2e.py
      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-gate-${{ github.run_id }}
          path: |
            AI_NEWSROOM_GITHUB_RC/reports
          retention-days: 7
          if-no-files-found: warn
