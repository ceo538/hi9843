name: AI NEWSROOM Windows E2E

on:
  push:
    branches: [codex/newsroom-development]
    paths:
      - AI_NEWSROOM_GITHUB_RC/scripts/windows_e2e.py
      - AI_NEWSROOM_GITHUB_RC/app/static/dashboard.html
      - .github/workflows/development-windows-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsroom-windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AI_NEWSROOM_GITHUB_RC
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_NEWSROOM_GITHUB_RC/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run DEV Windows browser E2E
        run: python scripts/windows_e2e.py
