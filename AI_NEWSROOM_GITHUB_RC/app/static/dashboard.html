<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI NEWSROOM</title><style>
body{margin:0;background:#0b0f14;color:#e8edf5;font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.muted{color:#8b98aa}.ok{color:#2dd4bf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#121821;border:1px solid #25303d;border-radius:12px;padding:16px}.label{font-size:12px;color:#8b98aa}.v{font-size:20px;font-weight:800;margin-top:6px}.panel{margin-top:16px;background:#121821;border:1px solid #25303d;border-radius:12px;padding:16px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><div class="wrap"><h1>AI NEWSROOM</h1><div class="muted">Release Candidate Control Center</div><div class="panel"><span class="ok">● SYSTEM ONLINE</span></div><div class="grid"><div class="card"><div class="label">Workflow</div><div class="v">READY</div></div><div class="card"><div class="label">Evidence</div><div class="v">READY</div></div><div class="card"><div class="label">Supply Chain</div><div class="v">READY</div></div></div><div class="panel" id="health">Health checking...</div></div><script>fetch('/api/health').then(r=>r.json()).then(d=>document.getElementById('health').textContent='API Health: '+d.status+' / '+d.release).catch(e=>document.getElementById('health').textContent='API Health: ERROR');</script></body></html>
